dataset_version: dataset-v1
runtime:
  window_ms: 1000
  step_ms: 500

# Historical Phase-0 illustrative weights; not the M30 calibrated experiment.
# R1 uses the separately versioned binary policy contract and frozen M30 reward.
cost_weights:
  error: 0.50
  latency: 0.25
  communication: 0.15
  energy: 0.10

evaluation_modes:
  - all_local
  - all_cloud
  - fixed_split
  - rule_based
  - learned_adaptive

# Production action mapping under Architecture R1 (historical datasets unchanged).
production_policy:
  architecture_revision: R1
  actions: {0: LOCAL, 1: CLOUD}
  status: gated_not_deployed
  policy_contract: ml/policy/policy_config_v2.json
  reward_contract: ml/policy/reward_binary_experiment_v1.json
